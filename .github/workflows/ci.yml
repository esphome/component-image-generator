---
name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test:coverage
      - name: Check the embedded font is up to date
        run: |
          npm run embed-font
          git diff --exit-code -- src/font-data.js
      - name: Check the reference badge is up to date
        run: |
          node src/cli.js ESPHome
          git diff --exit-code -- esphome.svg
      - run: npm pack --dry-run

  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./
        with:
          component: dallas_temp

      - name: Check the badge was written
        run: grep -q 'aria-label="dallas temp"' dallas_temp.svg
