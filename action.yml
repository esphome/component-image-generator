name: ESPHome Component Image Generator
description: Generates SVG images for components to be used on the ESPHome website

branding:
  icon: image
  color: white

inputs:
  component:
    description: "The component to generate an image for"
    required: true

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --ignore-scripts

    - name: Generate image
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
      run: node "$GITHUB_ACTION_PATH/src/cli.js" "$COMPONENT"
